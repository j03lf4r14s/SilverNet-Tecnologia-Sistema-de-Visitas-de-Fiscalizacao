<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitas de Fiscalização – SilverNet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --amarelo: #FFD700;
    --preto: #0f0f0f;
    --linha-par: #141414;
    --linha-impar: #1a1a1a;
    --borda: #2e2e2e;
    --branco: #f0f0f0;
    --muted: #888;
    --verde: #4CAF50;
    --vermelho: #E53935;
    --header-bg: #FFD700;
    --col-header-bg: #FFD700;
    --col-header-text: #111;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--preto);
    color: var(--branco);
    min-height: 100vh;
  }

  /* ══ HEADER ══ */
  header {
    background: #111;
    border-bottom: 3px solid var(--amarelo);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--amarelo);
    text-transform: uppercase;
  }
  .logo span { color: #fff; }
  .sub { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

  .topo-btns { display: flex; gap: 8px; }
  .btn-topo {
    background: #1e1e1e;
    border: 1px solid #333;
    color: #ccc;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-topo:hover { border-color: var(--amarelo); color: var(--amarelo); }
  .btn-topo.danger:hover { border-color: var(--vermelho); color: var(--vermelho); }

  /* ══ IMPORTAR (compacto, colapsável) ══ */
  .import-strip {
    background: #161616;
    border-bottom: 1px solid #2a2a2a;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .import-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--amarelo);
    text-transform: uppercase;
    white-space: nowrap;
  }
  textarea#inp-importar {
    flex: 1;
    background: #1e1e1e;
    border: 1px solid #333;
    color: var(--branco);
    padding: 8px 12px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    border-radius: 3px;
    resize: none;
    height: 44px;
    outline: none;
    line-height: 1.4;
    transition: border-color 0.2s;
  }
  textarea#inp-importar:focus { border-color: var(--amarelo); }
  textarea#inp-importar::placeholder { color: #444; }
  .btn-importar {
    background: var(--amarelo);
    color: #111;
    border: none;
    padding: 8px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    height: 44px;
    transition: background 0.15s;
  }
  .btn-importar:hover { background: #e6b800; }

  /* ══ CORPO ══ */
  .corpo { padding: 20px 24px; }

  /* ══ BLOCO DE DATA ══ */
  .bloco-data { margin-bottom: 0; }

  /* ── Cabeçalho de data (célula mesclada amarela) ── */
  .row-data-header {
    background: var(--amarelo);
    color: #111;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    padding: 6px 12px;
    border: 1px solid #c8a800;
  }

  /* ── Cabeçalho das colunas ── */
  .row-col-header {
    display: grid;
    grid-template-columns: var(--gcols);
    background: var(--amarelo);
    border-bottom: 2px solid #c8a800;
  }
  .col-h {
    padding: 5px 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #111;
    border-right: 1px solid #c8a800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .col-h:last-child { border-right: none; }

  /* ── Linhas de dados ── */
  .row-dado {
    display: grid;
    grid-template-columns: var(--gcols);
    border-bottom: 1px solid var(--borda);
    transition: background 0.1s;
  }
  .row-dado:nth-child(odd)  { background: var(--linha-par); }
  .row-dado:nth-child(even) { background: var(--linha-impar); }
  .row-dado:hover { background: #242424; }

  .cel {
    padding: 6px 8px;
    font-size: 11px;
    color: var(--branco);
    border-right: 1px solid var(--borda);
    overflow: hidden;
    line-height: 1.4;
    display: flex;
    align-items: center;
  }
  .cel:last-child { border-right: none; }
  .cel-data   { font-size: 10px; color: #ddd; white-space: nowrap; }
  .cel-tec    { font-weight: 600; font-size: 11px; }
  .cel-cli    { font-weight: 600; }
  .cel-end    { font-size: 10px; color: #bbb; }
  .cel-tel    { font-size: 10px; }
  .cel-motivo { color: #FFC107; font-size: 10px; font-weight: 500; }
  .cel-info   { color: #80CBC4; font-size: 10px; font-style: italic; }
  .cel-caixa  { font-family: 'Courier New', monospace; font-size: 10px; color: #80CBC4; }
  .cel-porta  { text-align: center; font-weight: 700; justify-content: center; }
  .cel-lacre  { font-weight: 700; font-size: 10px; }
  .cel-del    { justify-content: center; cursor: pointer; color: #444; font-size: 13px; transition: color 0.2s; }
  .cel-del:hover { color: var(--vermelho); }

  /* Separação entre blocos de data */
  .spacer { height: 16px; }

  /* ══ VAZIO ══ */
  .empty-state {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    border: 1px dashed #2a2a2a;
    border-radius: 4px;
    margin-top: 8px;
  }
  .empty-state .ei { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; line-height: 1.8; }
  .empty-state em { color: var(--amarelo); font-style: normal; font-weight: 600; }

  /* ══ MODAL ══ */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-overlay.ativo { display: flex; }
  .modal-box {
    background: #1a1a1a; border: 1px solid #333; border-top: 3px solid var(--vermelho);
    border-radius: 6px; padding: 28px 32px; max-width: 340px; width: 90%; text-align: center;
  }
  .modal-box .mi { font-size: 30px; margin-bottom: 10px; }
  .modal-box p { font-size: 14px; line-height: 1.6; margin-bottom: 20px; color: #ddd; }
  .modal-btns { display: flex; gap: 10px; }
  .mbtn-c {
    flex:1; background:#2a2a2a; border:1px solid #444; color:#ccc;
    padding:10px; border-radius:3px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .mbtn-c:hover { background: #383838; }
  .mbtn-ok {
    flex:1; background: var(--vermelho); border:none; color:#fff;
    padding:10px; border-radius:3px; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  }
  .mbtn-ok:hover { background:#c62828; }

  /* ══ TOAST ══ */
  .toast {
    position:fixed; bottom:20px; right:20px; background:var(--verde); color:#fff;
    padding:11px 18px; border-radius:4px; font-size:12px; font-weight:600;
    opacity:0; transform:translateY(8px); transition:all 0.25s; z-index:999; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateY(0); }

  /* ══ PRINT ══ */
  @media print {
    .import-strip, .topo-btns, .cel-del { display: none !important; }
    header { position: static; }
    body { background: white; color: black; }
    .row-data-header { background: #FFD700 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .row-col-header { background: #FFD700 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cel { color: #111 !important; font-size: 9px !important; }
    .cel-motivo, .cel-info, .cel-caixa { color: #333 !important; }
    .row-dado { background: white !important; border-bottom: 1px solid #ccc !important; }
    .row-dado:nth-child(even) { background: #f9f9f9 !important; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div>
    <div class="logo">Silver<span>Net</span> Tecnologia</div>
    <div class="sub">Sistema de Visitas de Fiscalização</div>
  </div>
  <div class="topo-btns">
    <button class="btn-topo" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn-topo" onclick="exportar()">⬇️ Exportar</button>
    <button class="btn-topo danger" onclick="limparTudo()">🗑️ Limpar Tudo</button>
  </div>
</header>

<!-- ═══ BARRA DE IMPORTAR ═══ -->
<div class="import-strip">
  <div class="import-label">⚡ Importar</div>
  <textarea id="inp-importar"
    placeholder="Cole aqui as linhas copiadas do sistema (Ctrl+V) e pressione Ctrl+Enter ou clique em Importar..."></textarea>
  <button class="btn-importar" onclick="importar()">⚡ Importar Visitas</button>
</div>

<!-- ═══ TABELA ═══ -->
<div class="corpo">
  <div id="area-visitas"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="mi">⚠️</div>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="mbtn-c" onclick="fecharModal()">Cancelar</button>
      <button class="mbtn-ok" id="modal-ok">Confirmar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── proporções das colunas (igual ao Excel da foto) ───
const GCOLS = '130px 150px 150px 190px 140px 150px 150px 130px 170px 50px 70px 80px 28px';
document.documentElement.style.setProperty('--gcols', GCOLS);

// ─── ESTADO ───
let visitas = JSON.parse(localStorage.getItem('sn_visitas') || '[]');

document.addEventListener('DOMContentLoaded', () => {
  renderizar();
  document.getElementById('inp-importar').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') importar();
  });
});

// ─── IMPORTAR ───
function importar() {
  const texto = document.getElementById('inp-importar').value.trim();
  if (!texto) { toast('⚠️ Cole as linhas do sistema antes.', '#E53935'); return; }

  const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);
  let n = 0;

  linhas.forEach(linha => {
    const c = linha.split('\t');
    if (c.length < 3) return;
    if (/^data/i.test(c[0].trim())) return;

    // 0=data/hora | 1=técnico | 2=cliente | 3=end.cliente | 4=telefone
    // 5=motivo | 6=info_tecnico | 7=caixa | 8=end.caixa | 9=porta | 10=lacre | 11=teste
    const dtRaw     = (c[0]  || '').trim();
    const tecnico   = (c[1]  || '').trim().toUpperCase();
    const cliente   = (c[2]  || '').trim().toUpperCase();
    const endCliRaw = (c[3]  || '').trim();
    const telRaw    = (c[4]  || '').trim();
    const motivo    = (c[5]  || '').trim();
    const infoTec   = (c[6]  || '').trim();
    const caixa     = (c[7]  || '').trim().toUpperCase();
    const endCxRaw  = (c[8]  || '').trim();
    const porta     = (c[9]  || '').trim();
    const lacre     = (c[10] || '').trim();
    const teste     = (c[11] || '').trim().toUpperCase();

    let data = '', hora = '';
    const mDt = dtRaw.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
    if (mDt) { data = `${mDt[3]}-${mDt[2]}-${mDt[1]}`; hora = `${mDt[4]}:${mDt[5]}`; }
    if (!data || !cliente) return;

    const limparEnd = raw => {
      const mR = raw.match(/Endere[çc]o:\s*(.+?)(?=\s+CEP:)/i);
      const mN = raw.match(/N[úu]mero:\s*(\S+)/i);
      const mC = raw.match(/Complemento:\s*(.+?)(?=\s+Refer)/i);
      const mB = raw.match(/Bairro:\s*(.+?)(?=\s+Apartamento:)/i);
      const mP = raw.match(/CEP:\s*([\d\-]+)/i);
      if (!mR) return raw;
      return [mR[1].trim(), mN?mN[1].trim():'', mC?mC[1].trim():'', mB?mB[1].trim():'', mP?`CEP ${mP[1].trim()}`:'']
        .filter(p => p && p !== '-').join(', ');
    };

    const fones = [...telRaw.matchAll(/\(\d{2}\)\s*[\d\s\-]{8,}/g)].map(m => m[0].trim()).slice(0, 2);
    const telefone = fones.length ? fones.join(' / ') : telRaw.replace(/[A-Za-záéíóúÁÉÍÓÚ:]+/g,'').trim().slice(0,50);

    visitas.push({
      id: Date.now() + n,
      data, hora, tecnico,
      caixa, endCaixa: limparEnd(endCxRaw), porta, lacre, teste,
      cliente, endereco: limparEnd(endCliRaw), telefone, motivo,
      infoTecnico: infoTec
    });
    n++;
  });

  if (n > 0) {
    salvar(); renderizar();
    document.getElementById('inp-importar').value = '';
    toast(`✅ ${n} visita${n > 1 ? 's importadas' : ' importada'} com sucesso!`);
  } else {
    toast('⚠️ Nenhuma linha válida. Verifique o formato.', '#E53935');
  }
}

// ─── RENDERIZAR ───
function renderizar() {
  const area = document.getElementById('area-visitas');

  if (visitas.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="ei">📂</div>
      <p>Nenhuma visita registrada.<br>
      Cole as linhas do sistema na barra acima e clique em <em>⚡ Importar Visitas</em>.</p>
    </div>`;
    return;
  }

  const grupos = {};
  visitas.forEach(v => { if (!grupos[v.data]) grupos[v.data] = []; grupos[v.data].push(v); });
  const datas = Object.keys(grupos).sort((a, b) => b.localeCompare(a));

  const cols = [
    { label: 'DATA FEITA'                  },
    { label: 'NOME DO TÉCNICO'             },
    { label: 'NOME DO CLIENTE'             },
    { label: 'ENDEREÇO DO CLIENTE'         },
    { label: 'TELEFONE'                    },
    { label: 'MOTIVO DA ABERTURA DA ORDEM' },
    { label: 'INFORMAÇÃO DO TÉCNICO'       },
    { label: 'CAIXA'                       },
    { label: 'ENDEREÇO DA CAIXA'           },
    { label: 'PORTA'                       },
    { label: 'LACRE'                       },
    { label: 'TESTE - IPV6 - VELOCIDADE'   },
    { label: ''                            },
  ];

  area.innerHTML = datas.map((dt, idx) => {
    const lista = grupos[dt].sort((a, b) => (b.hora||'').localeCompare(a.hora||''));
    const [ano, mes, dia] = dt.split('-');
    const dtFmt = `${dia}/${mes}/${ano}`;
    const n = lista.length;

    const colHeaders = cols.map(col =>
      `<div class="col-h">${col.label}</div>`
    ).join('');

    const rows = lista.map(v => {
      const dtExibir = `${dtFmt} ${v.hora||''}`;
      const semLacre = !v.lacre || v.lacre.toUpperCase().includes('SEM') || v.lacre.toUpperCase() === 'NÃO';
      const lacreColor = semLacre ? '#E57373' : '#A5D6A7';
      const testeVal = v.teste || '–';
      const testeSim = testeVal.toUpperCase() === 'SIM';
      const testeColor = testeSim ? '#A5D6A7' : (testeVal === '–' ? '#888' : '#E57373');

      const cells = [
        `<div class="cel cel-data">${dtExibir}</div>`,
        `<div class="cel cel-tec">${v.tecnico||'–'}</div>`,
        `<div class="cel cel-cli">${v.cliente}</div>`,
        `<div class="cel cel-end">${v.endereco||'–'}</div>`,
        `<div class="cel cel-tel">${v.telefone||'–'}</div>`,
        `<div class="cel cel-motivo">${v.motivo||'–'}</div>`,
        `<div class="cel cel-info">${v.infoTecnico||'–'}</div>`,
        `<div class="cel cel-caixa">${v.caixa||'–'}</div>`,
        `<div class="cel cel-end">${v.endCaixa||'–'}</div>`,
        `<div class="cel cel-porta">${v.porta||'–'}</div>`,
        `<div class="cel cel-lacre" style="color:${lacreColor}">${v.lacre||'–'}</div>`,
        `<div class="cel cel-porta" style="color:${testeColor};justify-content:center">${testeVal}</div>`,
        `<div class="cel cel-del" onclick="excluir(${v.id})" title="Excluir">✕</div>`,
      ].join('');

      return `<div class="row-dado">${cells}</div>`;
    }).join('');

    return `
      <div class="bloco-data">
        <div class="row-data-header">📅 ${dtFmt} VISITA DE FISCALIZAÇÃO JB &nbsp;·&nbsp; ${n} VISITA${n>1?'S':''}</div>
        <div class="row-col-header">${colHeaders}</div>
        ${rows}
      </div>
      ${idx < datas.length - 1 ? '<div class="spacer"></div>' : ''}`;
  }).join('');
}

// ─── AÇÕES ───
function excluir(id) {
  abrirModal('Deseja excluir esta visita?', () => {
    visitas = visitas.filter(v => v.id !== id);
    salvar(); renderizar(); toast('🗑️ Visita removida.');
  });
}
function limparTudo() {
  abrirModal('Apagar TODAS as visitas? Esta ação não pode ser desfeita.', () => {
    visitas = []; salvar(); renderizar();
    toast('🗑️ Todos os registros apagados.', '#E53935');
  });
}
function exportar() {
  const blob = new Blob([JSON.stringify(visitas, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `visitas_silvernet_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  toast('⬇️ Arquivo exportado!');
}
function abrirModal(msg, cb) {
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal-overlay').classList.add('ativo');
  document.getElementById('modal-ok').onclick = () => { fecharModal(); cb(); };
}
function fecharModal() { document.getElementById('modal-overlay').classList.remove('ativo'); }
function salvar() { localStorage.setItem('sn_visitas', JSON.stringify(visitas)); }
function toast(msg, cor = '#4CAF50') {
  const t = document.getElementById('toast');
  t.style.background = cor; t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
